<!DOCTYPE html>
<html>
<head>
  <title>Stellar Portfolio Infra</title>
</head>

<body style="font-family: Arial; padding: 40px; max-width: 800px; margin: auto;">

  <h1>Stellar Portfolio Infra</h1>
  <p>Multi-wallet portfolio aggregation for Stellar builders</p>

  <textarea id="addresses" placeholder="Enter wallet addresses (one per line)"
    style="width:100%; height:120px; padding:10px;"></textarea>

  <button onclick="fetchPortfolio()" 
    style="padding:12px; width:100%; margin-top:10px; cursor:pointer;">
    Aggregate Portfolio
  </button>

  <p id="status" style="margin-top:20px;"></p>

  <pre id="jsonOutput" style="background:#111; color:#0f0; padding:15px; margin-top:20px; overflow:auto;"></pre>

<script>
async function fetchPortfolio() {
  const raw = document.getElementById("addresses").value;
  const status = document.getElementById("status");
  const output = document.getElementById("jsonOutput");

  output.innerText = "";

  const addresses = raw
    .split("\n")
    .map(a => a.trim())
    .filter(a => a.length > 0);

  if (addresses.length === 0) {
    status.innerText = "Enter at least one wallet address";
    return;
  }

  status.innerText = "Loading portfolios...";

  try {
    // XLM price
    const priceRes = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=stellar&vs_currencies=usd");
    const priceData = await priceRes.json();
    const xlmPrice = priceData.stellar.usd;

    let aggregated = {
      wallets: addresses.length,
      totalXLM: 0,
      totalUSD: 0,
      assets: {}
    };

    // Process each wallet
    for (let addr of addresses) {

      const res = await fetch(`https://horizon.stellar.org/accounts/${addr}`);

      if (!res.ok) {
        console.log("Skipping invalid wallet:", addr);
        continue;
      }

      const data = await res.json();

      data.balances.forEach(b => {

        let isNative = b.asset_type === "native";

        let symbol = isNative ? "XLM" : b.asset_code;
        let amount = parseFloat(b.balance);

        let priceUSD = isNative ? xlmPrice : 0;
        let valueUSD = isNative ? amount * xlmPrice : 0;

        // INIT asset bucket if not exists
        if (!aggregated.assets[symbol]) {
          aggregated.assets[symbol] = {
            symbol: symbol,
            totalAmount: 0,
            totalValueUSD: 0,
            type: isNative ? "native" : "token"
          };
        }

        aggregated.assets[symbol].totalAmount += amount;
        aggregated.assets[symbol].totalValueUSD += valueUSD;

        if (isNative) {
          aggregated.totalXLM += amount;
          aggregated.totalUSD += valueUSD;
        }
      });
    }

    status.innerText = "Aggregation complete";

    output.innerText = JSON.stringify(aggregated, null, 2);

  } catch (e) {
    status.innerText = "Error: " + e.message;
    console.log(e);
  }
}
</script>

</body>
</html>
