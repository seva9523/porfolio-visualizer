<!DOCTYPE html>
<html>
<head>
  <title>Stellar Portfolio Infra</title>
</head>

<body style="font-family: Arial; padding: 40px; max-width: 700px; margin: auto;">

  <h1>Stellar Portfolio Infra</h1>
  <p>Developer-grade portfolio data layer for Stellar wallets</p>

  <input id="address" placeholder="Enter Stellar wallet (G...)" 
    style="padding:12px; width:100%; margin-bottom:10px;" />

  <button onclick="fetchPortfolio()" 
    style="padding:12px; width:100%; cursor:pointer;">
    Fetch Portfolio Data
  </button>

  <p id="status" style="margin-top:20px;"></p>

  <pre id="jsonOutput" style="background:#111; color:#0f0; padding:15px; margin-top:20px; overflow:auto;"></pre>

<script>
async function fetchPortfolio() {
  const address = document.getElementById("address").value;
  const status = document.getElementById("status");
  const output = document.getElementById("jsonOutput");

  output.innerText = "";

  if (!address) {
    status.innerText = "Enter a wallet address";
    return;
  }

  status.innerText = "Loading...";

  try {
    // Get XLM price
    const priceRes = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=stellar&vs_currencies=usd");
    const priceData = await priceRes.json();
    const xlmPrice = priceData.stellar.usd;

    // Get wallet data
    const res = await fetch(`https://horizon.stellar.org/accounts/${address}`);

    if (!res.ok) {
      if (res.status === 404) {
        status.innerText = "Account not found or not funded";
        return;
      }
      throw new Error("HTTP error " + res.status);
    }

    const data = await res.json();

    let portfolio = {
      address: address,
      assets: [],
      totalXLM: 0,
      totalUSD: 0
    };

    data.balances.forEach(b => {
      let asset = b.asset_type === "native" ? "XLM" : b.asset_code;
      let amount = parseFloat(b.balance);

      let valueUSD = asset === "XLM" ? amount * xlmPrice : 0;

      portfolio.assets.push({
        asset: asset,
        amount: amount,
        valueUSD: valueUSD
      });

      if (asset === "XLM") {
        portfolio.totalXLM += amount;
        portfolio.totalUSD += valueUSD;
      }
    });

    status.innerText = "Portfolio loaded";

    output.innerText = JSON.stringify(portfolio, null, 2);

  } catch (e) {
    status.innerText = "Error: " + e.message;
    console.log(e);
  }
}
</script>

</body>
</html>
