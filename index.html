<script>
  // ...keep everything else unchanged above...

  function renderDashboard(data) {
    document.getElementById("walletCount").textContent = data.wallets ?? data.walletCount ?? 0;
    document.getElementById("totalXLM").textContent = formatNumber(data.totalXLM || 0, 4);
    document.getElementById("totalUSD").textContent = formatCurrency(data.totalUSD || 0);

    const assetsSource = Array.isArray(data.assets)
      ? data.assets.map((a) => ({
          symbol: a.symbol,
          totalAmount: a.amount,
          totalValueUSD: a.usdValue,
          allocationPercent: a.allocationPercent
        }))
      : Object.values(data.assets || {}).map((a) => ({
          symbol: a.symbol,
          totalAmount: a.totalAmount,
          totalValueUSD: a.totalValueUSD,
          allocationPercent:
            (data.totalUSD || 0) > 0 ? (a.totalValueUSD / data.totalUSD) * 100 : 0
        }));

    const rows = assetsSource
      .sort((a, b) => (b.totalValueUSD || 0) - (a.totalValueUSD || 0))
      .map((asset) => `
        <tr>
          <td>${asset.symbol}</td>
          <td class="num">${formatNumber(asset.totalAmount || 0, 6)}</td>
          <td class="num">${formatCurrency(asset.totalValueUSD || 0)}</td>
          <td class="num">${formatNumber(asset.allocationPercent || 0, 2)}%</td>
        </tr>
      `)
      .join("");

    const body = document.getElementById("assetTableBody");
    body.innerHTML = rows || '<tr><td class="empty" colspan="4">No asset balances found.</td></tr>';
  }

  async function fetchPortfolio() {
    const addresses = getAddressesFromInput();

    if (addresses.length === 0) {
      setStatus("Enter at least one wallet address.", "error");
      return;
    }

    buttonEl.disabled = true;
    updateUrlWithWallets(addresses);
    setStatus("Loading portfolios...");

    try {
      const walletsParam = encodeURIComponent(addresses.join(","));
      const apiRes = await fetch(`/api/aggregate?wallets=${walletsParam}`);

      if (!apiRes.ok) {
        let msg = "API aggregation failed.";
        try {
          const errJson = await apiRes.json();
          msg = errJson?.error || msg;
        } catch (_) {}
        throw new Error(msg);
      }

      const apiData = await apiRes.json();

      // keep export compatibility with existing shape
      latestAggregated = {
        wallets: apiData.walletCount,
        totalXLM: apiData.totalXLM,
        totalUSD: apiData.totalUSD,
        assets: (apiData.assets || []).reduce((acc, a) => {
          acc[a.symbol] = {
            symbol: a.symbol,
            totalAmount: a.amount,
            totalValueUSD: a.usdValue,
            type: a.symbol === "XLM" ? "native" : "token"
          };
          return acc;
        }, {})
      };

      renderDashboard(apiData);
      setStatus("Aggregation complete.");
    } catch (error) {
      console.error(error);
      setStatus(`Error: ${error.message}`, "error");
    } finally {
      buttonEl.disabled = false;
    }
  }

  // ...keep everything else unchanged below...
</script>
