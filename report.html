<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>WealthView Report</title>
  <style>
    :root { --text:#111; --muted:#555; --border:#ddd; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; color:var(--text); margin:24px; }
    h1,h2,h3{ margin:0 0 8px 0; }
    .muted{ color:var(--muted); }
    .card{ border:1px solid var(--border); border-radius:12px; padding:16px; margin-top:14px; }
    table{ width:100%; border-collapse:collapse; font-size:13px; }
    th,td{ text-align:left; padding:8px; border-bottom:1px solid var(--border); vertical-align:top; }
    th{ font-weight:700; }
    .grid{ display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
    .kpi{ font-size:22px; font-weight:800; }
    .btnbar{ display:flex; gap:10px; margin-top:14px; }
    button{ padding:10px 12px; border:1px solid var(--border); border-radius:10px; background:#fff; cursor:pointer; }
    @media print {
      body { margin:0.5in; }
      .btnbar { display:none; }
      .card { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="muted">WealthView.pro — Educational report (not advice)</div>
  <h1 id="r-title">Portfolio Report</h1>
  <div class="muted" id="r-sub"></div>

  <div class="btnbar">
    <button onclick="window.print()">Print / Save as PDF</button>
    <button onclick="window.close()">Close</button>
  </div>

  <div class="card">
    <h2>Summary</h2>
    <div class="grid" style="margin-top:10px;">
      <div>
        <div class="muted">Total Value</div>
        <div class="kpi" id="r-total">$0</div>
      </div>
      <div>
        <div class="muted">Holdings</div>
        <div class="kpi" id="r-count">0</div>
      </div>
    </div>
    <div class="muted" style="margin-top:10px; line-height:1.5;">
      This report is generated from your locally saved portfolio data in your browser.
    </div>
  </div>

  <div class="card">
    <h2>Top Holdings</h2>
    <table>
      <thead>
        <tr><th>Ticker</th><th>Allocation</th><th>Value</th></tr>
      </thead>
      <tbody id="r-top"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>All Holdings</h2>
    <table>
      <thead>
        <tr><th>Ticker</th><th>Shares</th><th>Price</th><th>Value</th></tr>
      </thead>
      <tbody id="r-all"></tbody>
    </table>
  </div>

  <script>
    function money(x){ return '$' + (Number(x||0)).toFixed(2); }
    function pct(x){ return (Number(x||0)).toFixed(1) + '%'; }

    function load() {
      const pkey = localStorage.getItem('currentPortfolio');
      const ps = JSON.parse(localStorage.getItem('portfolios') || '{}');
      const p = ps && pkey ? ps[pkey] : null;
      const title = document.getElementById('r-title');
      const sub = document.getElementById('r-sub');

      if (!p) {
        title.textContent = 'No portfolio found';
        sub.textContent = 'Open the Portfolio Visualizer first, then try again.';
        return;
      }

      title.textContent = (p.name || 'Portfolio') + ' — Report';
      sub.textContent = new Date().toLocaleString();

      const holdings = (p.holdings || []).map(h => ({
        ticker: (h.ticker||'').toUpperCase(),
        shares: Number(h.shares||0),
        price: Number(h.price||0),
        value: Number(h.value||0)
      })).filter(h => h.ticker);

      const total = holdings.reduce((s,h)=>s+h.value,0);
      document.getElementById('r-total').textContent = money(total);
      document.getElementById('r-count').textContent = holdings.length;

      const top = [...holdings].sort((a,b)=>b.value-a.value).slice(0,10);
      const topBody = document.getElementById('r-top');
      topBody.innerHTML = top.map(h => `
        <tr>
          <td><strong>${h.ticker}</strong></td>
          <td>${pct(total>0 ? (h.value/total*100) : 0)}</td>
          <td>${money(h.value)}</td>
        </tr>
      `).join('');

      const allBody = document.getElementById('r-all');
      allBody.innerHTML = holdings.map(h => `
        <tr>
          <td><strong>${h.ticker}</strong></td>
          <td>${h.shares.toFixed(4)}</td>
          <td>${money(h.price)}</td>
          <td>${money(h.value)}</td>
        </tr>
      `).join('');
    }
    load();
  </script>
</body>
</html>
