<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WealthView Report</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; }
    .muted { color: #666; }
    h1 { margin: 0 0 6px 0; }
    h2 { margin-top: 18px; }
    table { border-collapse: collapse; width: 100%; margin-top: 8px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 12px; }
    @media print { .no-print { display: none; } body { margin: 10mm; } }
  </style>
</head>
<body>
  <div class="no-print" style="display:flex; gap:10px; align-items:center; justify-content:space-between;">
    <div>
      <strong>Tip:</strong> Use your browser’s Print dialog and choose “Save as PDF”.
      <span class="muted">(This is educational content, not financial advice.)</span>
    </div>
    <button onclick="window.print()">Print / Save as PDF</button>
  </div>

  <h1>Portfolio Report</h1>
  <div class="muted" id="meta"></div>

  <div class="grid" style="margin-top:12px;">
    <div class="card">
      <h2 style="margin:0 0 6px 0;">Holdings</h2>
      <table id="holdingsTbl">
        <thead><tr><th>Ticker</th><th>Weight</th><th>Class</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="card">
      <h2 style="margin:0 0 6px 0;">Summary</h2>
      <div id="summary"></div>
    </div>
  </div>

  <script>
    function safeParse(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key) || "null") ?? fallback; } catch(e){ return fallback; }
    }
    const portfolios = safeParse("portfolios", {});
    const currentPortfolio = localStorage.getItem("currentPortfolio") || "";
    const p = portfolios?.[currentPortfolio];

    document.getElementById("meta").textContent =
      `Generated: ${new Date().toLocaleString()} • Portfolio: ${currentPortfolio || "N/A"}`;

    const tbody = document.querySelector("#holdingsTbl tbody");
    if (p?.holdings?.length) {
      p.holdings.forEach(h => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${h.ticker || ""}</td><td>${(h.weight ?? 0).toFixed(2)}%</td><td>${h.assetClass || ""}</td>`;
        tbody.appendChild(tr);
      });
    } else {
      tbody.innerHTML = `<tr><td colspan="3" class="muted">No holdings found in localStorage.</td></tr>`;
    }

    // Basic summary (kept simple on purpose)
    const summary = document.getElementById("summary");
    const totalW = (p?.holdings || []).reduce((s,h)=>s + (Number(h.weight)||0), 0);
    summary.innerHTML = `
      <div><strong>Total weight:</strong> ${totalW.toFixed(2)}%</div>
      <div class="muted" style="margin-top:8px;">
        Educational report generated from your saved portfolio data in this browser.
      </div>
    `;
  </script>
</body>
</html>
