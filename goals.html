<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financial Goals Simulator</title>

<style>
:root {
  --bg: #F8FAFC;
  --card: #ffffff;
  --border: #E2E8F0;
  --text: #0F172A;
  --muted: #64748B;
  --accent: #14B8A6;
}

body {
  margin: 0;
  font-family: Inter, system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 24px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 16px;
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.goal-actions {
  display: flex;
  gap: 8px;
}

.edit-btn {
  padding: 6px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: white;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}

.edit-btn:hover {
  border-color: var(--accent);
  background: rgba(20,184,166,0.08);
}

.delete-btn {
  padding: 6px 12px;
  border-radius: 8px;
  border: none;
  background: #ef4444;
  color: white;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}

.delete-btn:hover {
  background: #dc2626;
}

button.primary {
  background: var(--accent);
  color: white;
  border: none;
  padding: 10px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
}

button.primary:hover {
  opacity: .9;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: white;
  padding: 24px;
  border-radius: 12px;
  width: 320px;
}

.modal input {
  width: 100%;
  margin-bottom: 10px;
  padding: 8px;
}
</style>
</head>
<body>

<div class="container">
  <button class="primary" onclick="openModal()">Add Financial Goal</button>

  <div id="goals"></div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="modalTitle">Add Goal</h3>
    <input id="goalName" placeholder="Goal name">
    <input id="target" type="number" placeholder="Target amount">
    <input id="years" type="number" placeholder="Years">
    <button class="primary" id="saveBtn" onclick="saveGoal()">Save</button>
  </div>
</div>

<script>
let goals = [];
let editingId = null;

function openModal() {
  editingId = null;
  modalTitle.innerText = "Add Goal";
  modal.style.display = "flex";
}

function editGoal(id) {
  const g = goals.find(x => x.id === id);
  if (!g) return;

  editingId = id;
  goalName.value = g.name;
  target.value = g.target;
  years.value = g.years;

  modalTitle.innerText = "Change Goal";
  modal.style.display = "flex";
}

function saveGoal() {
  const data = {
    id: editingId ?? Date.now(),
    name: goalName.value,
    target: target.value,
    years: years.value
  };

  if (editingId) {
    goals = goals.map(g => g.id === editingId ? data : g);
  } else {
    goals.push(data);
  }

  modal.style.display = "none";
  goalName.value = target.value = years.value = "";
  render();
}

function deleteGoal(id) {
  goals = goals.filter(g => g.id !== id);
  render();
}

function render() {
  goalsContainer = document.getElementById("goals");
  goalsContainer.innerHTML = goals.map(g => `
    <div class="card">
      <div class="card-header">
        <strong>${g.name}</strong>
        <div class="goal-actions">
          <button class="edit-btn" onclick="editGoal(${g.id})">Change Goal</button>
          <button class="delete-btn" onclick="deleteGoal(${g.id})">Delete</button>
        </div>
      </div>
      <p>Target: $${g.target}</p>
      <p>Years: ${g.years}</p>
    </div>
  `).join("");
}

const modal = document.getElementById("modal");
const modalTitle = document.getElementById("modalTitle");
</script>

</body>
</html>
