name: Nightly QA

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - run: npm install

      - name: Validate themes.json schema
        run: npm run qa:themes

      - name: API smoke tests
        env:
          BASE_URL: https://www.wealthview.pro
        run: npm run qa:api
        continue-on-error: true

      - name: Unit tests
        run: npm test

      - name: Cypress E2E tests
        run: npx cypress run
        env:
          CYPRESS_BASE_URL: https://www.wealthview.pro
        continue-on-error: true

      - name: Upload Cypress screenshots & videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-results
          path: |
            cypress/screenshots/
            cypress/videos/
