<!DOCTYPE html>
<html>
<head>
  <title>Stellar Portfolio Infra Demo</title>
</head>

<body style="font-family: Arial; padding: 40px; max-width: 800px; margin: auto;">

  <h1>Stellar Portfolio SDK Demo</h1>

  <p>Enter wallet addresses (one per line):</p>

  <textarea id="wallets" style="width:100%; height:120px; padding:10px;"></textarea>

  <button onclick="run()" style="width:100%; padding:12px; margin-top:10px;">
    Load Portfolio
  </button>

  <div id="app" style="margin-top:20px;"></div>

  <script src="./stellar-portfolio-sdk.js"></script>

  <script>
    async function run() {
      const raw = document.getElementById("wallets").value;

      const addresses = raw
        .split("\n")
        .map(x => x.trim())
        .filter(Boolean);

      const container = document.getElementById("app");

      if (!addresses.length) {
        container.innerHTML = "Please enter at least one wallet";
        return;
      }

      await StellarPortfolio.renderPortfolio(container, addresses);
    }
  </script>

</body>
</html>
